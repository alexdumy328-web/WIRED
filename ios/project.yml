name: NorgelisTech
options:
  bundleIdPrefix: ro.norgelis
  deploymentTarget:
    iOS: "18.0"
  xcodeVersion: "16.0"
  defaultConfig: Release

configs:
  Debug: debug
  Release: release

settings:
  base:
    IPHONEOS_DEPLOYMENT_TARGET: "18.0"
    SWIFT_VERSION: "5.0"
    ENABLE_USER_SCRIPT_SANDBOXING: "YES"
    TARGETED_DEVICE_FAMILY: "1"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  NorgelisTech:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: NorgelisTech
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ro.norgelis.app
        PRODUCT_NAME: NorgelisTech
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_FILE: NorgelisTech/Resources/Info.plist
        INFOPLIST_PREPROCESS: "YES"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_STYLE: Automatic
        # The server the app talks to. Release builds default to the production site; a command line
        # override (NORGELIS_API_BASE_URL=http://192.168.1.20:8790) points a Debug build at a local server.
        NORGELIS_API_BASE_URL: "https://norgelis.ro"
        # The website origin Better Auth trusts (BETTER_AUTH_URL or APP_ORIGINS), for example http://localhost:5173 in dev.
        NORGELIS_SITE_ORIGIN: ""
        # Shown in the app when set. Empty hides the matching row.
        NORGELIS_SUPPORT_EMAIL: ""
        NORGELIS_PHONE: "+40 (771) 332 210"
        NORGELIS_DRIVER_PHONE: "(0758) 561 001"
        # The legal pages default to <server>/confidentialitate and <server>/termeni. Set these to override.
        NORGELIS_PRIVACY_URL: ""
        NORGELIS_TERMS_URL: ""
        # A Google Form link. The feedback row stays hidden until this is set.
        NORGELIS_FEEDBACK_URL: ""
      configs:
        Debug:
          CODE_SIGN_IDENTITY: "-"
          INFOPLIST_PREPROCESSOR_DEFINITIONS: "DEBUG_BUILD=1"
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "DEBUG"
        Release:
          SWIFT_COMPILATION_MODE: wholemodule
          SWIFT_OPTIMIZATION_LEVEL: "-O"
          VALIDATE_PRODUCT: "YES"
          STRIP_INSTALLED_PRODUCT: "YES"
          DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
  NorgelisTechTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: NorgelisTechTests
    dependencies:
      - target: NorgelisTech
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ro.norgelis.app.tests
        GENERATE_INFOPLIST_FILE: "YES"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"

schemes:
  NorgelisTech:
    build:
      targets:
        NorgelisTech: all
        NorgelisTechTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - NorgelisTechTests
    archive:
      config: Release
