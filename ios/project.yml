name: NorgelisTech
options:
  bundleIdPrefix: ro.norgelis
  deploymentTarget:
    iOS: "18.0"
  xcodeVersion: "16.0"
  defaultConfig: Debug

settings:
  base:
    IPHONEOS_DEPLOYMENT_TARGET: "18.0"
    SWIFT_VERSION: "5.0"
    ENABLE_USER_SCRIPT_SANDBOXING: "YES"
    TARGETED_DEVICE_FAMILY: "1,2"

targets:
  NorgelisTech:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: NorgelisTech
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ro.norgelis.app
        PRODUCT_NAME: NorgelisTech
        INFOPLIST_FILE: NorgelisTech/Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        GENERATE_INFOPLIST_KEY_UIBackgroundModes: "location"
        # Override on the command line, for example NORGELIS_API_BASE_URL=http://192.168.1.20:8790
        NORGELIS_API_BASE_URL: ""
