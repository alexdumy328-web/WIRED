<!doctype html>
<html lang="ro">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <title>Norgelis Tech · Service electronice Iași</title>
    <meta name="description" content="Reparații laptopuri, PC, plăci de bază, espressoare și electrocasnice în Iași. Electrică auto la mașina ta." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,62..125,100..900;1,62..125,100..900&display=swap" rel="stylesheet" />
    <script>
      (function () {
        try {
          var raw = localStorage.getItem('nt-consent');
          var prefs = raw && JSON.parse(raw).preferences === true;
          if (prefs) {
            var t = localStorage.getItem('nt-theme');
            if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
          }
          var l = new URLSearchParams(location.search).get('lang') || (prefs ? localStorage.getItem('nt-lang') : null);
          if (l === 'en' || l === 'ro') document.documentElement.lang = l;
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
